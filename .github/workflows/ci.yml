name: CI

# Runs on every PR. A PR is the only path to main (which deploys), so this is
# the gate that catches test/template/frontend breakage before it ships.
# Intentionally not triggered on branch pushes — that would double every run.
on:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  validate:
    name: Validate SAM template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validate template
        run: sam validate --lint

  web-build:
    name: Web build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # No API URL available outside the deploy job — a clean compile is all we
      # need here to prove the frontend isn't broken.
      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build
