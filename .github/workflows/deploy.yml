name: Deploy to Production

on:
  push:
    branches: [main]
  # Allow manual re-deploys / deploying without a code push.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Never let two production deploys run at once. Queue, don't cancel — we don't
# want to interrupt an in-flight CloudFormation update.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  validate:
    name: Validate SAM Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Validate template
        run: sam validate --lint

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, validate]
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::831635640076:role/github-actions-river-sage
          aws-region: eu-west-1

      - name: Upload data sources config to S3
        run: |
          aws s3 cp config/data_sources.json \
            s3://river-data-ireland-prod/config/data_sources.json \
            --region eu-west-1 \
            --content-type application/json

      - name: Build Lambda functions
        run: sam build

      - name: Deploy infrastructure
        run: sam deploy --config-env production --no-confirm-changeset

      - name: Build web app
        run: |
          export VITE_API_BASE_URL=$(aws cloudformation describe-stacks \
            --stack-name river-data-scraper-prod --region eu-west-1 \
            --query 'Stacks[0].Outputs[?OutputKey==`RiverGuruApiUrl`].OutputValue' \
            --output text)
          cd web && npm ci && npm run build

      # Two-pass sync: hashed build assets are content-addressed and safe to
      # cache forever; HTML must never be long-cached or users get a stale SPA.
      - name: Deploy web app to S3 (immutable assets)
        run: |
          aws s3 sync web/dist/ s3://river-guru-web-production/ \
            --region eu-west-1 \
            --delete \
            --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Deploy web app to S3 (HTML, no-cache)
        run: |
          aws s3 sync web/dist/ s3://river-guru-web-production/ \
            --region eu-west-1 \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public,max-age=0,must-revalidate"

      # The site is fronted by Cloudflare (not CloudFront), proxying directly to
      # the S3 website bucket. Cloudflare treats HTML as DYNAMIC (not edge-cached)
      # and the hashed assets are immutable, so the cache headers above usually
      # suffice. This purge is belt-and-braces and only runs if the Cloudflare
      # secrets are present, so it's safe to leave unconfigured.
      # (secrets can't be used in a step `if:` directly, so gate on an env var)
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        if: ${{ vars.CLOUDFLARE_ZONE_ID != '' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — skipping purge"; exit 0
          fi
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
