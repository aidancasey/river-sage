# SAM Configuration File
# This file stores default parameters for SAM deployments

version = 0.1

[default]
[default.global.parameters]
stack_name = "river-data-scraper"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
region = "eu-west-1"
parameter_overrides = "Environment=production S3BucketName=river-data-ireland-prod ScheduleExpression=\"rate(1 hour)\" WebAppBucketName=river-guru-web AllowedOrigin=\"https://theriverguru.com,https://www.theriverguru.com\""

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"

# Production environment configuration
# (production is the only deployed environment — there is no dev/staging cloud env)
[production]
[production.global.parameters]
stack_name = "river-data-scraper-prod"

[production.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = true  # Always confirm in production
resolve_s3 = true
region = "eu-west-1"
parameter_overrides = "Environment=production S3BucketName=river-data-ireland-prod ScheduleExpression=\"cron(30 * * * ? *)\" WebAppBucketName=river-guru-web AllowedOrigin=\"https://theriverguru.com,https://www.theriverguru.com\""
fail_on_empty_changeset = false
